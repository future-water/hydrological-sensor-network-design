[metadata]
name = hydrosensornet
version = 0.1.0
author = Jeil Oh
description = A package for hydrological sensor network analysis and optimization
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/yourusername/hydrological-sensor-network-design
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.8
install_requires =
    numpy
    pandas
    xarray
    geopandas
    cartopy
    matplotlib
    scipy
    scikit-learn

[options.packages.find]
where = src 